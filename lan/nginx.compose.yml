name: nginx

networks:
  general:
    external: true

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ${CFG_PATH}/conf.d:/etc/nginx
      - ${CFG_PATH}/www:/var/www/server.local
      - ${CERTS_PATH}/server.local.pem:/etc/nginx/cert.pem:ro
      - ${CERTS_PATH}/server.local-key.pem:/etc/nginx/key.pem:ro'
    networks:
      general:
        ipv4_address: 172.18.0.254