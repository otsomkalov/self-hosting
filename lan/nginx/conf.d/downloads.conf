location = /downloads {
    return 301 /downloads/;
}

location /downloads/oauth2/ {
    proxy_pass http://oauth2-file-browser:4180;
    include /etc/nginx/proxy-headers.conf;
}

location = /downloads/oauth2/auth {
    proxy_pass http://oauth2-file-browser:4180;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}

location /downloads/ {
    auth_request /downloads/oauth2/auth;
    error_page 401 = @downloads_oauth2_signin;

    proxy_pass http://file-browser:8080/;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header X-Forwarded-Prefix /downloads;
    proxy_redirect off;
}

location @downloads_oauth2_signin {
    return 302 /downloads/oauth2/sign_in?rd=$scheme://$host$request_uri;
}
