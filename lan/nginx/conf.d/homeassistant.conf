location = /homeassistant {
    return 301 /homeassistant/;
}

location /homeassistant/ {
    proxy_pass http://homeassistant:8123/;
    include /etc/nginx/proxy-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Prefix /homeassistant;
    proxy_redirect / /homeassistant/;
}

location ~ ^/(frontend_latest/|hacsfiles/|static/|local/|api/|auth/|config/|profile|lovelace|manifest\.json$|sw-modern\.js$|service_worker\.js$|favicon\.ico$) {
    proxy_pass http://homeassistant:8123;
    include /etc/nginx/proxy-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Prefix /homeassistant;
    proxy_redirect / /homeassistant/;
}

location = /esphome {
    return 301 /esphome/;
}

location /esphome/ {
    proxy_pass http://esphome:6052/;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header X-Forwarded-Prefix /esphome;
}
