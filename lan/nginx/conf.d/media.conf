location = /jackett {
    return 301 /jackett/;
}

location /jackett/oauth2/ {
    proxy_pass http://oauth2-jackett:4180;
    include /etc/nginx/proxy-headers.conf;
}

location = /jackett/oauth2/auth {
    proxy_pass http://oauth2-jackett:4180;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}

location /jackett/ {
    auth_request /jackett/oauth2/auth;
    error_page 401 = @jackett_oauth2_signin;

    proxy_pass http://jackett:9117/;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header X-Forwarded-Prefix /jackett;
    proxy_redirect / /jackett/;
}

location @jackett_oauth2_signin {
    return 302 /jackett/oauth2/sign_in?rd=$scheme://$host$request_uri;
}

location = /jellyfin {
    return 301 /jellyfin/web/;
}

location /jellyfin/ {
    client_max_body_size 20M;
    proxy_pass http://jellyfin:8096/;
    include /etc/nginx/proxy-headers.conf;

    proxy_set_header X-Forwarded-Prefix /jellyfin;
    proxy_buffering off;
}

location = /jellyfin/web/ {
    proxy_pass http://jellyfin:8096/web/index.html;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header X-Forwarded-Protocol $scheme;
}

location /jellyfin/socket {
    proxy_pass http://jellyfin:8096/socket;
    include /etc/nginx/proxy-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Protocol $scheme;
}

location = /radarr {
    return 301 /radarr/;
}

location /radarr/ {
    proxy_pass http://radarr:7878;
    include /etc/nginx/proxy-headers.conf;

    proxy_set_header X-Forwarded-Prefix /radarr;
}

location = /sonarr {
    return 301 /sonarr/;
}

location /sonarr/ {
    proxy_pass http://sonarr:8989;
    include /etc/nginx/proxy-headers.conf;

    proxy_set_header X-Forwarded-Prefix /sonarr;
}

location = /lidarr {
    return 301 /lidarr/;
}

location /lidarr/ {
    proxy_pass http://lidarr:8686;
    include /etc/nginx/proxy-headers.conf;

    proxy_set_header X-Forwarded-Prefix /lidarr;
}

location = /torrent {
    return 301 /torrent/;
}

location /torrent/oauth2/ {
    proxy_pass http://oauth2-torrent:4180;
    include /etc/nginx/proxy-headers.conf;
}

location = /torrent/oauth2/auth {
    proxy_pass http://oauth2-torrent:4180;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}

location /torrent/ {
    client_max_body_size 2m;
    auth_request /torrent/oauth2/auth;
    error_page 401 = @torrent_oauth2_signin;

    proxy_pass http://torrent:8080/;
    include /etc/nginx/proxy-headers.conf;
    proxy_set_header X-Forwarded-Prefix /torrent;
    proxy_redirect off;
}

location @torrent_oauth2_signin {
    return 302 /torrent/oauth2/sign_in?rd=$scheme://$host$request_uri;
}
