events {
    worker_connections 2048;
}

http {
    large_client_header_buffers 4 16k;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    server {
        listen 80 default_server;
        server_name _;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate cert.pem;
        ssl_certificate_key key.pem;

        return 404;
    }

    server {
        listen 443 ssl;
        server_name server.local;

        ssl_certificate cert.pem;
        ssl_certificate_key key.pem;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        root /var/www/server.local;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        include /etc/nginx/calibre.conf;
        include /etc/nginx/downloads.conf;
        include /etc/nginx/homeassistant.conf;
        include /etc/nginx/media.conf;
        include /etc/nginx/navidrome.conf;
        include /etc/nginx/status.conf;
    }
}
