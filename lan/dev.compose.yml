name: dev

volumes:
  azure-storage-emulator:
  pg:

services:
  azure-storage-emulator:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azure-storage-emulator
    restart: always
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
  pg:
    container_name: pg
    image: postgres:alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - pg:/var/lib/postgresql
