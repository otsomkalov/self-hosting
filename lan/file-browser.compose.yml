name: file-browser

networks:
  general:
    external: true

volumes:
  file-browser:

services:
  file-browser:
    image: hurlenko/filebrowser
    container_name: file-browser
    user: "1000:1000"
    restart: always
    environment:
      - FB_BASEURL=/
      - FB_NOAUTH=true
    expose:
      - 8080
    volumes:
      - /mnt/downloads:/data
      - file-browser:/config
    networks:
      - general

  oauth2-file-browser:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-file-browser
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: ${CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://downloads.server.local/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://file-browser:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${ISSUER_URL}
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    expose:
      - 4180
    depends_on:
      - file-browser
    networks:
      - general