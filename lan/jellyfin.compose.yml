name: jellyfin

networks:
  general_general:
    external: true

volumes:
  jellyfin-cfg:
  jellyfin-cache:

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "1000:1000"
    group_add:
      - "109"
      - "44"
      - "106"
    restart: always
    environment:
      - JELLYFIN_PublishedServerUrl=https://192.168.3.254
    ports:
      - "1900:1900/udp"
      - "7359:7359/udp"
      - "8920:8920/tcp"
      - "8096:8096/tcp"
    volumes:
      - jellyfin-cfg:/config
      - jellyfin-cache:/cache
      - /mnt/downloads:/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      - general_general
